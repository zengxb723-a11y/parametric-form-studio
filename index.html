<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>参数形态生成所</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#17201f;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.top{height:70px;padding:0 24px;background:#fff;border-bottom:1px solid #e6e8ed;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}.brand{font-weight:800;letter-spacing:.03em}.brand i{color:#0878e8;font-style:normal}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #dbe0e8;border-radius:9px;padding:9px 12px;background:#fff;color:#17201f;font:inherit;cursor:pointer}button.primary{background:#0878e8;border-color:#0878e8;color:#fff}.app{display:grid;grid-template-columns:260px minmax(420px,1fr) 300px;min-height:calc(100vh - 70px)}.panel{background:#fbfbfc;padding:18px;border-right:1px solid #e6e8ed;overflow:auto;max-height:calc(100vh - 70px);position:sticky;top:70px}.panel.right{border-right:0;border-left:1px solid #e6e8ed}.stage{padding:28px;display:grid;place-items:center;min-width:0}.card{width:min(100%,1050px);background:#fff;padding:14px;border-radius:16px;border:1px solid #e3e6eb;box-shadow:0 12px 38px #17201f12}.caption{display:flex;justify-content:space-between;font-size:13px;margin:0 3px 10px}.dot{color:#19ba63}.canvas-wrap{background:#fff;border:1px solid #edf0f4;border-radius:10px;overflow:hidden}.canvas-wrap canvas{display:block;width:100%;height:auto;aspect-ratio:3/2}.section{margin-bottom:22px}.section h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em;color:#4e5663}.modes,.shapes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modes button,.shapes button{text-align:left;font-size:13px}.modes button.active,.shapes button.active{border-color:#0878e8;color:#0878e8;background:#f1f7ff}.control{display:grid;grid-template-columns:1fr auto;gap:7px;margin:13px 0;font-size:13px}.control input[type=range]{grid-column:1/3;width:100%;accent-color:#0878e8}.control input[type=color]{width:42px;height:24px;padding:0;border:0;background:none}.control output{color:#0878e8;font-variant-numeric:tabular-nums}.upload{display:block;border:1px dashed #b9c3d0;padding:10px;border-radius:9px;font-size:13px;color:#0878e8}.upload input{display:block;margin-top:6px;max-width:100%}.hint{font-size:12px;color:#717985;line-height:1.5}.saved{display:grid;gap:7px}.saved button{display:flex;justify-content:space-between;text-align:left}.empty{font-size:12px;color:#717985}.footer{font-size:12px;color:#717985;margin-top:10px}@media(max-width:980px){.app{grid-template-columns:230px 1fr}.right{grid-column:1/3;position:static;max-height:none;border-top:1px solid #e6e8ed}.panel{top:70px}.stage{padding:18px}}@media(max-width:680px){.top{height:auto;min-height:64px;padding:10px 14px}.app{display:block}.panel{position:static;max-height:none;border:0;border-top:1px solid #e6e8ed}.stage{padding:12px;position:sticky;top:64px;z-index:3;background:#f5f6f8}.card{padding:10px;border-radius:12px}.caption{font-size:12px}.actions button{padding:7px 9px;font-size:12px}.modes,.shapes{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="brand"><i>◆</i> 参数形态生成所</div><div class="actions"><button id="reset">重置</button><button id="random">完整随机</button><button id="save">保存本机方案</button><button id="svg">导出 SVG</button><button class="primary" id="png">透明 PNG</button></div></header>
<main class="app"><aside class="panel"><div class="section"><h2>图案逻辑</h2><div class="modes" id="modes"></div></div><div class="section"><h2>基础图形</h2><div class="shapes" id="shapes"></div></div><div class="section"><h2>自定义图形</h2><label class="upload">上传黑白 PNG / JPG<input id="upload" type="file" accept="image/*"></label><p class="hint">图片仅在当前浏览器内处理，不上传；保存方案时需重新上传。</p></div><div class="section"><h2>本机方案库</h2><div class="saved" id="saved"></div></div></aside><section class="stage"><div class="card"><div class="caption"><span><b class="dot">●</b> 实时预览</span><span id="metric"></span></div><div class="canvas-wrap"><canvas id="canvas" width="1200" height="800"></canvas></div><p class="footer">所有计算、图片处理与导出均在本机浏览器完成；预览背景不会进入透明导出。</p></div></section><aside class="panel right"><div class="section"><h2>网格与尺寸</h2><div id="controls"></div></div><div class="section"><h2>颜色与边界</h2><label class="control">图形色<input id="fg" type="color"></label><label class="control">输出边界<select id="bound"><option value="full">矩形</option><option value="circle">圆形</option><option value="round">圆角矩形</option></select></label></div><p class="hint">双击滑杆数值可精确输入。参数自动保存在浏览器本机。</p></aside></main>
<script>
const $=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d'),key='pfs-static-v1';
const base={mode:'grid',shape:'circle',density:38,size:35,spaceX:60,spaceY:60,aspect:100,rotate:0,noise:0,strength:60,fg:'#17201f',bound:'full',seed:12345};let p={...base,...JSON.parse(localStorage.getItem(key)||'{}')},image=null;
const modes=[['grid','规则阵列'],['linear','线性渐变'],['radial','径向渐变'],['organic','有机扰动'],['edge','中心秩序'],['wave','流场波纹']],shapes=[['circle','圆点'],['square','方形'],['diamond','菱形'],['capsule','胶囊'],['triangle','三角'],['hexagon','六边形'],['custom','自定义']];
const sliders=[['density','阵列密度',8,100,''],['size','单元尺寸',4,100,'%'],['spaceX','水平间距',0,100,'%'],['spaceY','垂直间距',0,100,'%'],['aspect','宽扁比例',40,180,'%'],['rotate','基础旋转',-180,180,'°'],['noise','随机错位',0,100,'%'],['strength','逻辑强度',0,100,'%']];
const rand=(n)=>{const x=Math.sin(n*12.9898+p.seed)*43758.5453;return x-Math.floor(x)};const clip=()=>{ctx.beginPath();if(p.bound==='circle')ctx.arc(600,400,370,0,7);else if(p.bound==='round')ctx.roundRect(40,28,1120,744,58);else ctx.rect(0,0,1200,800);ctx.clip()};
function marks(){let a=[],cols=p.density,dx=1140/(cols-1)*(1+p.spaceX/160),dy=dx*(1+p.spaceY/160),rows=Math.ceil(740/dy);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let px=30+x*dx,py=30+y*dy,n=rand(x+y*131),t=x/(cols-1),r=Math.hypot(t-.5,(y/(rows-1))-.5)*1.414;if(p.mode==='radial')t=r;if(p.mode==='organic')t=n;if(p.mode==='edge')t=r;if(p.mode==='wave')t=(Math.sin(x*.35+y*.24)+1)/2;let s=3+p.size*.19*(p.mode==='grid'?1:.25+t*p.strength/100),j=p.noise*.14;px+=(n-.5)*j;py+=(rand(x*9+y*17)-.5)*j;a.push({x:px,y:py,s,angle:p.rotate+(n-.5)*p.noise*.8,scale:1+(p.aspect-100)/100})}return a}
function draw(){localStorage.setItem(key,JSON.stringify(p));ctx.clearRect(0,0,1200,800);ctx.save();clip();ctx.fillStyle=p.fg;let a=marks();for(const m of a){ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.angle*Math.PI/180);if(p.shape==='custom'&&image){ctx.drawImage(image,-m.s*m.scale,-m.s,m.s*2*m.scale,m.s*2)}else{ctx.scale(m.scale,1);if(p.shape==='circle')ctx.beginPath(),ctx.arc(0,0,m.s,0,7),ctx.fill();else if(p.shape==='square')ctx.fillRect(-m.s,-m.s,m.s*2,m.s*2);else if(p.shape==='diamond'){ctx.rotate(Math.PI/4);ctx.fillRect(-m.s,-m.s,m.s*2,m.s*2)}else if(p.shape==='capsule'){ctx.roundRect(-m.s*1.5,-m.s*.55,m.s*3,m.s*1.1,m.s);ctx.fill()}else if(p.shape==='triangle'){ctx.beginPath();ctx.moveTo(0,-m.s);ctx.lineTo(m.s,m.s);ctx.lineTo(-m.s,m.s);ctx.closePath();ctx.fill()}else{ctx.beginPath();for(let i=0;i<6;i++)ctx.lineTo(Math.cos(i*Math.PI/3)*m.s,Math.sin(i*Math.PI/3)*m.s);ctx.closePath();ctx.fill()}ctx.restore()}ctx.restore();$('#metric').textContent=`${a.length} 个元素 · ${p.shape} · 本机模式`}
function render(){ $('#modes').innerHTML=modes.map(([id,n])=>`<button class="${p.mode===id?'active':''}" data-mode="${id}">${n}</button>`).join('');$('#shapes').innerHTML=shapes.map(([id,n])=>`<button class="${p.shape===id?'active':''}" data-shape="${id}">${n}</button>`).join('');$('#controls').innerHTML=sliders.map(([id,n,min,max,u])=>`<label class="control">${n}<output>${p[id]}${u}</output><input data-key="${id}" type="range" min="${min}" max="${max}" value="${p[id]}"></label>`).join('');$('#fg').value=p.fg;$('#bound').value=p.bound;draw();saved()}
function saved(){let all=JSON.parse(localStorage.getItem(key+'-saved')||'[]');$('#saved').innerHTML=all.length?all.map((x,i)=>`<button data-load="${i}">${x.name}<small>载入</small></button>`).join(''):'<p class="empty">保存的方案只存于此浏览器。</p>';document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{p={...base,...all[b.dataset.load].p};render()})}
document.body.onclick=e=>{let b=e.target.closest('[data-mode],[data-shape]');if(b){if(b.dataset.mode)p.mode=b.dataset.mode;if(b.dataset.shape)p.shape=b.dataset.shape;render()}};document.body.oninput=e=>{if(e.target.dataset.key){p[e.target.dataset.key]=+e.target.value;draw();e.target.previousElementSibling.textContent=p[e.target.dataset.key]+(sliders.find(x=>x[0]===e.target.dataset.key)[4]||'')}if(e.target.id==='fg'){p.fg=e.target.value;draw()}if(e.target.id==='bound'){p.bound=e.target.value;draw()}};
$('#upload').onchange=e=>{let f=e.target.files[0];if(!f)return;let im=new Image;im.onload=()=>{image=im;p.shape='custom';render()};im.src=URL.createObjectURL(f)};$('#reset').onclick=()=>{p={...base};render()};$('#random').onclick=()=>{p={...p,seed:Math.floor(Math.random()*999999),mode:modes[Math.floor(Math.random()*modes.length)][0],shape:shapes[Math.floor(Math.random()*6)][0],size:10+Math.floor(Math.random()*70),density:15+Math.floor(Math.random()*65),noise:Math.floor(Math.random()*70)};render()};$('#save').onclick=()=>{let all=JSON.parse(localStorage.getItem(key+'-saved')||'[]'),name=prompt('方案名称','方案 '+(all.length+1));if(name){all.unshift({name,p:{...p}});localStorage.setItem(key+'-saved',JSON.stringify(all.slice(0,20)));saved()}};
function svg(){let a=marks(),shape=m=>p.shape==='circle'?`<circle r="${m.s}"/>`:p.shape==='square'?`<rect x="-${m.s}" y="-${m.s}" width="${m.s*2}" height="${m.s*2}"/>`:p.shape==='diamond'?`<rect transform="rotate(45)" x="-${m.s}" y="-${m.s}" width="${m.s*2}" height="${m.s*2}"/>`:`<circle r="${m.s}"/>`,clip=p.bound==='circle'?'<circle cx="600" cy="400" r="370"/>':p.bound==='round'?'<rect x="40" y="28" width="1120" height="744" rx="58"/>':'<rect width="1200" height="800"/>',data=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><defs><clipPath id="c">${clip}</clipPath></defs><g fill="${p.fg}" clip-path="url(#c)">${a.map(m=>`<g transform="translate(${m.x} ${m.y}) rotate(${m.angle}) scale(${m.scale} 1)">${shape(m)}</g>`).join('')}</g></svg>`;return data}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}$('#svg').onclick=()=>download(new Blob([svg()],{type:'image/svg+xml'}),'pattern.svg');$('#png').onclick=()=>canvas.toBlob(b=>download(b,'pattern.png'),'image/png');render();
</script></body></html>
